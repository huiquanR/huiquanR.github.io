<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/assets/css/site-fonts.css">
<title>随笔 · 张汇泉</title>
<style>
body{max-width:760px;margin:64px auto;padding:0 24px;color:#24272b;font:17px/1.8 var(--site-font)}
a{color:#245da8;text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:38px;font-weight:400}p,time{color:#626a73}
ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #e5e7e9}
time{display:inline-block;width:125px;font:14px var(--site-font)}
</style>
</head>
<body>
<p><a href="../">← 返回主页</a></p>
<h1>随笔与杂文</h1>
<p>一些关于社会、生活与音乐的文字。</p>
<ul>
{% assign sorted_posts = site.pages | where: "layout", "post" | sort: "date" | reverse %}
{% for post in sorted_posts %}
<li><time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%Y-%m-%d" }}</time><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>
{% endfor %}
</ul>
</body>
</html>

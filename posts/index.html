---
layout: default
title: "随笔"
---

<section class="post-index" aria-labelledby="posts-title">
<p class="post-back"><a href="/">← 返回主页</a></p>
<h1 id="posts-title" class="post-title">随笔</h1>
<p class="post-index-intro">一些关于社会、生活与音乐的文字。</p>
<ul class="post-list">
{% assign sorted_posts = site.pages | where: "layout", "post" | sort: "date" | reverse %}
{% for post in sorted_posts %}
<li><time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%Y-%m-%d" }}</time><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>
{% endfor %}
</ul>
</section>

---
layout: default
---
<style>
@import url("/assets/css/site-fonts.css");
body{font-family:var(--site-font)}
.post-page{max-width:760px;margin:0 auto}
.post-back{margin:0 0 24px;font:14px/1.6 var(--site-font)}
.post-meta{margin:0 0 8px;color:#626a73;font:14px/1.6 var(--site-font)}
.post-title{margin:0 0 30px!important;padding:0!important;font-size:34px!important;line-height:1.35!important;font-weight:400!important}
.post-content{font-size:17px;line-height:1.85}
.post-content img{max-width:100%;height:auto}
@media(max-width:520px){.post-title{font-size:29px!important}.post-content{font-size:16px}}
</style>
<article class="post-page">
<p class="post-back"><a href="/posts/">← 全部文章</a></p>
<p class="post-meta">{{ page.date | date: "%Y-%m-%d" }}</p>
<h1 class="post-title">{{ page.title | escape }}</h1>
<div class="post-content">
{{ content }}
</div>
</article>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/assets/css/site-fonts.css">
<title>{{ page.title | escape }} · Tony Huiquan Zhang</title>
<style>
:root{--ink:#24272b;--muted:#626a73;--line:#d9dde1;--link:#245da8;--paper:#fff;--rail:260px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--site-font);font-size:17px;line-height:1.72}
a:link,a:visited{color:var(--site-link);text-decoration:none}
a:hover,a:focus-visible{color:var(--site-link);text-decoration:underline}
a:focus-visible{outline:2px solid var(--site-link);outline-offset:3px}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--rail);padding:55px 34px 32px 42px;border-right:1px solid var(--line);background:#fff}
.brand{display:block;margin:0 0 46px;color:var(--ink)!important;font-family:var(--site-font);font-size:23px;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:13px}
.nav a{font-family:var(--site-font);font-size:17px}
main{margin-left:var(--rail);max-width:1120px;padding:55px 7vw 70px}
.post-page{max-width:850px}
.post-back{margin:0 0 24px;font-size:15px}
.post-meta{margin:0 0 8px;color:var(--muted);font-size:14px;line-height:1.6}
.post-title{font-size:43px;line-height:1.2;margin:0 0 24px;font-weight:400;color:#17191c}
.post-content{font-size:17px;line-height:1.72;color:var(--ink)}
.post-content img{max-width:100%;height:auto}
.post-content p{margin:0 0 1em}
.post-content ul,.post-content ol{padding-left:24px}
.site-footer{max-width:850px;margin-top:34px;padding-top:14px;border-top:1px solid var(--line);color:#777f87;font-size:13px;line-height:1.7}
.skip{position:absolute;left:-9999px}
.skip:focus{left:10px;top:10px;background:white;padding:8px;z-index:5}
@media(max-width:850px){:root{--rail:0px}.sidebar{position:relative;width:auto;height:auto;padding:22px 22px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:21px;margin:0 0 14px}.nav{flex-direction:row;flex-wrap:wrap;gap:8px 18px}main{margin:0;padding:34px 24px 55px}.post-title{font-size:35px}}
@media(max-width:520px){body{font-size:16px}.sidebar{padding:18px 18px 12px}.nav{gap:5px 14px}.nav a{font-size:15px}main{padding:28px 18px 42px}.post-title{font-size:31px}.post-content{font-size:16px}}
</style>
</head>
<body>
<a class="skip" href="#main-content">Skip to content</a>
<aside class="sidebar">
<a class="brand" href="/#home">Tony Huiquan Zhang</a>
<nav class="nav" aria-label="Main navigation">
<a href="/#home">Home</a>
<a href="/#publications">Publications</a>
<a href="/#research">Research</a>
<a href="/#teaching">Teaching</a>
<a href="/#data">Data &amp; Code</a>
<a href="/#music">Music &amp; Lyrics</a>
<a href="/#contact">Contact</a>
</nav>
</aside>
<main id="main-content">
{{ content }}
<p class="site-footer">© 2026 · Tony Huiquan Zhang · 张汇泉 · <a href="https://github.com/huiquanR">GitHub</a></p>
</main>
</body>
</html>
